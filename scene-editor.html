<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumatone Scene Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body class="flex flex-col w-full h-full">

  <div id="controls" class="flex-none flex flex-col bg-surface border-b border-border text-fg/high">
    <div class="flex items-center gap-4 px-4 py-2 flex-wrap">
      <span class="text-lg font-semibold tracking-wide text-accent">Scene Editor</span>

      <label class="ctrl-label">
        Scene JSON
        <input type="file" id="scene-file-input" accept="application/json" class="ctrl-select">
      </label>

      <label class="ctrl-label">
        MIDI File
        <input type="file" id="midi-file-input" accept=".mid,.midi" class="ctrl-select">
      </label>

      <label class="ctrl-label">
        Resolution
        <select id="resolution-select" class="ctrl-select">
          <option value="preview">Match Preview</option>
          <option value="1080x1920">1080×1920 (9:16)</option>
          <option value="1920x1080">1920×1080 (16:9)</option>
          <option value="1080x1080">1080×1080 (1:1)</option>
          <option value="custom">Custom…</option>
        </select>
      </label>

      <label id="resolution-custom-wrap" class="ctrl-label hidden">
        <input type="number" id="resolution-width" min="16" step="2" value="1080" class="ctrl-number">
        ×
        <input type="number" id="resolution-height" min="16" step="2" value="1920" class="ctrl-number">
      </label>

      <button id="play-btn" disabled
        class="btn-primary disabled:opacity-40 disabled:cursor-not-allowed">
        ► Play
      </button>

      <button id="render-btn" disabled
        class="btn-primary disabled:opacity-40 disabled:cursor-not-allowed">
        ⏺ Render
      </button>

      <button id="stop-btn" class="hidden btn-primary-danger">
        ⏹ Stop
      </button>

      <span id="render-status" class="text-fg/label text-sm"></span>

      <span class="text-fg/label text-xs ml-auto" title="Space: Play/Stop toggle&#10;←/→: scrub 0.1s (Shift: 1s)&#10;Home/End: jump to start/end&#10;Delete: remove selected keyframe&#10;Esc: stop">
        ⌨ Shortcuts
      </span>
    </div>
  </div>

  <div id="timeline" class="flex-none flex flex-col gap-2 px-4 py-3 bg-surface border-b border-border">
    <div class="flex items-center gap-3">
      <span class="ctrl-label w-16">Time</span>
      <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" class="ctrl-range flex-1">
      <span id="scrub-time" class="text-fg/label text-sm tabular-nums w-24 text-right">0.0 / 0.0s</span>
    </div>

    <div class="flex items-center gap-3">
      <span class="ctrl-label w-16">Camera</span>
      <div id="camera-track" class="flex-1"></div>
      <button id="camera-add-btn" class="btn-small">+ kf</button>
      <button id="camera-del-btn" class="btn-small-danger">delete</button>
    </div>
    <div id="camera-inspector" class="flex items-center gap-3 pl-19 text-sm"></div>

    <div class="flex items-center gap-3">
      <span class="ctrl-label w-16">Mode</span>
      <div id="mode-track" class="flex-1"></div>
      <button id="mode-add-btn" class="btn-small">+ kf</button>
      <button id="mode-del-btn" class="btn-small-danger">delete</button>
    </div>
    <div id="mode-inspector" class="flex items-center gap-3 pl-19 text-sm"></div>
  </div>

  <div id="channels-panel" class="flex-none flex flex-col gap-2 px-4 py-3 bg-surface border-b border-border">
    <div class="flex items-center gap-3">
      <button id="channels-fold-btn" type="button" class="ctrl-label cursor-pointer select-none" aria-expanded="true">▾ Channels</button>
      <span id="channels-summary" class="text-fg/hint text-xs"></span>
      <button id="channel-add-btn" class="btn-small">+ channel</button>
      <button id="save-scene-btn" class="btn-small ml-auto">Save Scene JSON</button>
    </div>
    <div id="channels-table" class="flex flex-col gap-1"></div>
  </div>

  <canvas id="preview-canvas" class="flex-1 block w-full min-h-0"></canvas>
  <script type="module" src="/src/sceneEditor.ts"></script>
</body>

</html>
